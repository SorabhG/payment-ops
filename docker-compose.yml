services:
  postgres:
    image: postgres:17
    container_name: payops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payops
      POSTGRES_USER: payops
      POSTGRES_PASSWORD: payops_local_password
    ports:
      - "5432:5432"
    volumes:
      - payops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payops -d payops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payops-postgres-data: