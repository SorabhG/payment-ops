
spring.application.name=payops

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/payops
spring.datasource.username=payops
spring.datasource.password=payops_local_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Database migrations
spring.flyway.enabled=true

# Hibernate must not create or modify the schema
spring.jpa.hibernate.ddl-auto=validate

# Actuator health checks
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health